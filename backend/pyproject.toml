[project]
name = "hackathon-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165,<0.166",
    "uvicorn[standard]>=0.54,<0.55",
    "openai>=2.30,<4",
    "langgraph>=1.2.24,<1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Only install when distinct roles ARE the demo story (section 4 decision rule).
crew = ["crewai>=1.15.44,<1.16"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error", "ignore::DeprecationWarning"]
