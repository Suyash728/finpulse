[project]
name = "finpulse-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165,<0.166",
    "uvicorn[standard]>=0.54,<0.55",
    "openai>=2.30,<4",
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "supabase>=2.10",
    "resend>=2.5",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27", "fpdf2>=2.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error", "ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]
