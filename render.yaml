# Reference only: we deploy as a plain free Web Service (Blueprints need a card).
# Copy these settings into the Render dashboard by hand.
services:
  - type: web
    name: finpulse-api
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --frozen --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - {key: PYTHON_VERSION, value: "3.12.13"}
      - {key: GROQ_API_KEY, sync: false}
      - {key: GEMINI_API_KEY, sync: false}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_KEY, sync: false}
      - {key: RESEND_API_KEY, sync: false}
      - {key: EMAIL_FROM, value: onboarding@resend.dev}
      - {key: DEMO_EMAIL, sync: false}
      - {key: CORS_ORIGINS, sync: false}
